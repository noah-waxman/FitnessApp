  #     ConnectionStrings__Default: "Host=db;Port=5432;Database=apidb;Username=postgres;Password=postgres"
  #   depends_on:
  #     db:
  #       condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apidb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apidb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
